spring:
  application:
    name: api-agencia
  # Valores de desenvolvimento (batem com o compose.yaml).
  # Em outro ambiente, sobrescrever com SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD.
  datasource:
    url: jdbc:postgresql://localhost:5432/agencia
    username: agencia
    password: agencia
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        # JSON de página estável ({content, page: {...}}) em vez de serializar o PageImpl
        serialization-mode: via-dto
        max-page-size: 100
  web:
    # Mensagens de validação sempre em pt-BR, independente do idioma da máquina ou do header
    locale: pt_BR
    locale-resolver: fixed

# Regras comerciais (valores de exemplo). Percentuais como fração: 0.10 = 10%.
agencia:
  preco:
    minimo-passageiros-grupo: 6
    percentual-desconto-grupo: 0.10
    parcelas-sem-taxa: 3
    maximo-parcelas: 10
    taxa-por-parcela-extra: 0.015
