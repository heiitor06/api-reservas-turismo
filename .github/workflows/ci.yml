name: CI

on:
  push:
    branches: [main]
  pull_request:

# Um push novo na mesma branch cancela a execução anterior, que já ficou velha
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Unitários + integração + concorrência. O runner já tem Docker, então o Testcontainers sobe o Postgres.
      - name: ./mvnw verify
        run: ./mvnw -B -ntp verify

      - name: Relatórios de teste (só quando falha)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-de-teste
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
