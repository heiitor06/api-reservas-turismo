services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agencia
      POSTGRES_USER: agencia
      POSTGRES_PASSWORD: agencia
    ports:
      - "5432:5432"
    volumes:
      - agencia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencia -d agencia"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/agencia
      SPRING_DATASOURCE_USERNAME: agencia
      SPRING_DATASOURCE_PASSWORD: agencia
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        # só sobe a API quando o banco já aceita conexão (o Flyway roda na inicialização)
        condition: service_healthy

volumes:
  agencia-pgdata:
