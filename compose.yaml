services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agencia
      POSTGRES_USER: agencia
      POSTGRES_PASSWORD: agencia
    ports:
      - "5432:5432"
    volumes:
      - agencia-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencia -d agencia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  agencia-pgdata:
